name: Update research price snapshots

on:
  schedule:
    # After regular North American market close on weekdays.
    - cron: '30 22 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-price-snapshots:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update price snapshots
        run: node scripts/update-price-snapshots.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet; then
            echo "No price snapshot changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html research/index.html research/qcom/index.html research/maple/index.html research/galaxy/index.html
          git commit -m "Update daily research price snapshots"
          git push
